name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS for the Windows installer
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-plus-${{ matrix.name }}
          path: build/**/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.tar.gz' \) -print0 |
            xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
